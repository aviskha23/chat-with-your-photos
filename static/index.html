<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat With Your Photos</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #20231f;
    --muted: #686d66;
    --faint: #92958e;
    --wash: #e9e9e3;
    --accent: #466653;
    --err: #b42332;
    --row: 220px;               /* target photo height; change to taste */
    --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171916; --fg: #f3f2ec; --muted: #b0b3aa; --faint: #777d73; --wash: #292d28; --accent: #a2c2a9; --err: #ff8585; }
  }
  @media (max-width: 600px) { :root { --row: 150px; } }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--fg); background: var(--bg);
    font-family: var(--font); font-size: 16px; line-height: 1.45;
  }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 30px clamp(18px, 4vw, 56px) 76px; }
  .mark { margin: 0 0 clamp(34px, 8vh, 92px); font-size: .9rem; font-weight: 700; letter-spacing: .035em; }
  .mark::before { content: ""; display: inline-block; width: 18px; height: 3px; margin: 0 9px 3px 0; background: var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The one bold move: the query is the headline */
  .q {
    display: block; width: 100%; margin: 0; padding: 0 0 .08em;
    border: 0; border-bottom: 1px solid var(--muted); border-radius: 0;
    background: transparent; color: var(--fg); outline: none;
    -webkit-appearance: none; appearance: none;
    font: inherit; font-weight: 600; font-stretch: 68%;
    font-size: clamp(2.5rem, 9.2vw, 7.4rem); line-height: 1.04; letter-spacing: -.025em;
  }
  .q::placeholder { color: var(--faint); opacity: 1; }
  .q::-webkit-search-cancel-button { display: none; }
  .q:focus-visible { box-shadow: 0 2px 0 0 var(--accent); border-color: var(--accent); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 18px; }
  .go {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--bg); border: 0; border-radius: 2px; padding: 10px 22px; transition: opacity .15s, transform .15s;
  }
  .go:hover:not(:disabled) { opacity: .86; transform: translateY(-1px); }
  .go:disabled { opacity: .45; cursor: progress; }
  .upload-label {
    display: inline-block; cursor: pointer; color: var(--fg);
    border-bottom: 1px solid var(--muted); padding: 8px 0 5px;
  }
  .upload-label:hover { color: var(--accent); border-color: var(--accent); }
  #photo-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .upload-preview { display: none; align-items: center; gap: 12px; margin-top: 20px; color: var(--muted); font-size: .9rem; }
  .upload-preview.visible { display: flex; }
  .upload-preview img { width: 54px; height: 54px; object-fit: cover; }
  .count {
    font: inherit; color: var(--fg); cursor: pointer; background: transparent;
    border: 0; border-bottom: 1px solid var(--muted); border-radius: 0; padding: 2px 4px 2px 0;
  }
  .go:focus-visible, .count:focus-visible, .eg:focus-visible, .item:focus-visible {
    outline: 2px solid var(--fg); outline-offset: 3px;
  }

  .hint { margin: 22px 0 0; max-width: 62ch; color: var(--muted); }
  .eg {
    font: inherit; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  #status { margin: 56px 0 14px; min-height: 1.45em; color: var(--muted); max-width: 70ch; }
  #status.error { color: var(--err); font-weight: 600; }

  /* Photos keep their own proportions, laid out in justified rows */
  #grid { display: flex; flex-wrap: wrap; gap: 24px 7px; transition: opacity .15s; }
  #grid.stale { opacity: .35; }
  #grid::after { content: ""; flex-grow: 1000; }
  .item {
    --r: 1.4;
    flex: var(--r) 1 calc(var(--r) * var(--row)); min-width: 0;
    display: block; margin: 0; padding: 0; border: 0; background: none;
    color: inherit; font: inherit; text-align: left; cursor: zoom-in;
  }
  .item img { display: block; width: 100%; height: var(--row); object-fit: cover; background: var(--wash); }
  .cap {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .015em;
  }

  /* Full-screen viewer */
  dialog {
    padding: 0; border: 0; background: #000; color: #fff;
    width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: #000; }
  dialog img { flex: 1; min-height: 0; width: 100%; display: block; object-fit: contain; }
  .bar { display: flex; align-items: center; gap: 22px; padding: 14px clamp(16px, 3vw, 40px); font-size: .9rem; }
  .bar p { flex: 1; margin: 0; color: #bdbdbd; overflow-wrap: anywhere; }
  .bar button {
    font: inherit; color: #fff; background: none; border: 0; padding: 6px 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .bar button:disabled { opacity: .35; cursor: default; text-decoration: none; }
  .bar button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="mark">Chat With Your Photos</p>

  <form id="form" role="search">
    <label class="sr" for="q">Describe a photo</label>
    <input class="q" id="q" name="q" type="search" placeholder="a dog playing outside"
           autocomplete="off" enterkeyhint="search" autofocus>
    <div class="controls">
      <button class="go" id="go" type="submit">Search text</button>
      <label class="upload-label" for="photo-file">Search with a photo</label>
      <input id="photo-file" type="file" accept="image/*" aria-label="Choose a photo to search with">
      <select class="count" id="k" aria-label="Number of results">
        <option value="8">8 results</option>
        <option value="12" selected>12 results</option>
        <option value="24">24 results</option>
        <option value="48">48 results</option>
      </select>
    </div>
  </form>

  <p class="hint" id="hint"></p>
  <div class="upload-preview" id="upload-preview">
    <img id="upload-thumb" alt="Selected photo preview">
    <span id="upload-name"></span>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="grid"></div>
</div>

<dialog id="dlg" aria-label="Photo viewer">
  <img id="dlg-img" alt="">
  <div class="bar">
    <p id="dlg-text"></p>
    <button type="button" id="prev">Previous</button>
    <button type="button" id="next">Next</button>
    <button type="button" id="close">Close</button>
  </div>
</dialog>

<script>
  // Served by FastAPI itself, so same origin: no CORS setup needed.
  const API = "";
  const EXAMPLES = ["a dog playing outside", "people on a beach", "a man riding a bike", "children playing in water"];

  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("q"), kSel = $("k"), goBtn = $("go");
  const fileInput = $("photo-file"), uploadPreview = $("upload-preview");
  const uploadThumb = $("upload-thumb"), uploadName = $("upload-name");
  const grid = $("grid"), statusEl = $("status"), hint = $("hint");
  const dlg = $("dlg"), dlgImg = $("dlg-img"), dlgText = $("dlg-text"), prevBtn = $("prev"), nextBtn = $("next");

  let current = { query: "", results: [] };
  let openIdx = -1;

  // Hint line: index size (from the API) plus clickable example searches
  const note = document.createElement("span");
  hint.appendChild(note);
  hint.append("Try ");
  EXAMPLES.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "eg"; b.textContent = text;
    b.addEventListener("click", () => { input.value = text; search(); });
    hint.appendChild(b);
    hint.append(i < EXAMPLES.length - 2 ? ", " : i === EXAMPLES.length - 2 ? " or " : ".");
  });
  fetch(API + "/").then((r) => r.json()).then((d) => {
    if (d.indexed_images) note.textContent = `Searching ${d.indexed_images.toLocaleString()} photos. `;
  }).catch(() => {});

  form.addEventListener("submit", (e) => { e.preventDefault(); search(); });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      fileInput.value = "";
      setStatus("Please choose an image file.", true);
      return;
    }
    uploadThumb.src = URL.createObjectURL(file);
    uploadName.textContent = `Selected: ${file.name}`;
    uploadPreview.classList.add("visible");
    searchByImage(file);
  });

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
  }

  async function search() {
    const q = input.value.trim();
    if (!q) { setStatus("Describe a photo first, for example: a dog playing outside."); input.focus(); return; }

    goBtn.disabled = true;
    grid.classList.add("stale");
    setStatus("Searching");

    try {
      const res = await fetch(`${API}/search-by-text?q=${encodeURIComponent(q)}&top_k=${kSel.value}`);
      if (!res.ok) {
        let detail = `The server returned an error (${res.status}).`;
        try { const body = await res.json(); if (typeof body.detail === "string") detail = body.detail; } catch (_) {}
        throw new Error(detail);
      }
      render(await res.json());
    } catch (err) {
      grid.replaceChildren();
      setStatus(err instanceof TypeError
        ? "Can't reach the search server. Start it with: python -m uvicorn main:app --reload"
        : err.message, true);
    } finally {
      grid.classList.remove("stale");
      goBtn.disabled = false;
    }
  }

  async function searchByImage(file) {
    goBtn.disabled = true;
    grid.classList.add("stale");
    setStatus("Searching for visually similar photos...");
    const formData = new FormData();
    formData.append("file", file);
    try {
      const res = await fetch(`${API}/search-by-image?top_k=${kSel.value}`, {
        method: "POST",
        body: formData
      });
      if (!res.ok) {
        let detail = `The server returned an error (${res.status}).`;
        try { const body = await res.json(); if (typeof body.detail === "string") detail = body.detail; } catch (_) {}
        throw new Error(detail);
      }
      const data = await res.json();
      render(data, true);
    } catch (err) {
      grid.replaceChildren();
      setStatus(err instanceof TypeError
        ? "Can't reach the search server. Start it with: python -m uvicorn main:app --reload"
        : err.message, true);
    } finally {
      grid.classList.remove("stale");
      goBtn.disabled = false;
    }
  }

  function render(data, imageSearch = false) {
    grid.replaceChildren();
    const results = data.results || [];
    current = { query: data.query, results };

    if (!results.length) {
      setStatus(`Nothing matched "${data.query}". Try different or fewer words.`);
      return;
    }
    setStatus(imageSearch
      ? `${results.length} photos similar to your upload. Rank is on the left, similarity on the right.`
      : `${results.length} photos for "${data.query}". Under each photo: rank on the left, similarity on the right.`);

    results.forEach((r, i) => {
      const item = document.createElement("button");
      item.type = "button"; item.className = "item";
      item.setAttribute("aria-label", `Open photo ${r.rank} of ${results.length}, similarity ${r.score.toFixed(3)}`);

      const img = new Image();
      img.alt = `Photo ranked ${r.rank} for ${data.query}`;
      img.addEventListener("load", () => {
        if (img.naturalHeight) item.style.setProperty("--r", (img.naturalWidth / img.naturalHeight).toFixed(3));
      });
      img.addEventListener("error", () => { img.alt = "This image could not be loaded"; });
      img.src = API + r.image_url;

      const cap = document.createElement("span");
      cap.className = "cap";
      const rank = document.createElement("span"); rank.textContent = r.rank;
      const score = document.createElement("span"); score.textContent = r.score.toFixed(3);
      cap.append(rank, score);

      item.append(img, cap);
      item.addEventListener("click", () => show(i));
      grid.appendChild(item);
    });
  }

  function show(i) {
    const r = current.results[i];
    if (!r) return;
    openIdx = i;
    dlgImg.src = API + r.image_url;
    dlgImg.alt = `Photo ranked ${r.rank} for ${current.query}`;
    dlgText.textContent = `${r.rank} of ${current.results.length} for "${current.query}". Similarity ${r.score.toFixed(3)}. ${r.filename}`;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === current.results.length - 1;
    if (!dlg.open) dlg.showModal();
  }

  prevBtn.addEventListener("click", () => show(openIdx - 1));
  nextBtn.addEventListener("click", () => show(openIdx + 1));
  $("close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") show(openIdx - 1);
    if (e.key === "ArrowRight") show(openIdx + 1);
  });
</script>
</body>
</html>
